version: "2"
run:
  timeout: 5m
  go: 1.26.1
  build-tags:
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    funlen:
      lines: 150
      statements: 80
    gosec:
      excludes:
        - G204
        - G304
        - G306
        - G301
        - G203
        - G115
        - G703
        - G702
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    warn-unused: true
    rules:
      - path: internal/config/config.go
        linters:
          - cyclop
      - path: internal/content/blob.go
        text: calculated cyclomatic complexity for function buildTree is
        linters:
          - cyclop
      - path: internal/content/filesystem.go
        text: calculated cyclomatic complexity for function walkEntry is 12
        linters:
          - cyclop
      - path: cmd/dynamic-markdown-site/main.go
        text: calculated cyclomatic complexity for function run is 12
        linters:
          - cyclop
      - path: cmd/dynamic-markdown-site/watcher.go
        text: calculated cyclomatic complexity for function watchForChanges is
        linters:
          - cyclop
      - path: internal/server/suggestions.go
        text: calculated cyclomatic complexity for function findSuggestions is
        linters:
          - cyclop
      - path: (.*)_test\.go
        linters:
          - cyclop
      - path: (.*)_test\.go
        linters:
          - exhaustruct
      - path: internal/content/filesystem.go
        linters:
          - exhaustruct
      - path: internal/content/blob.go
        linters:
          - exhaustruct
      - path: internal/content/memory.go
        linters:
          - exhaustruct
      - path: internal/domain/file.go
        linters:
          - exhaustruct
      - path: internal/renderer/markdown.go
        linters:
          - exhaustruct
      - path: internal/server/ratelimit.go
        linters:
          - exhaustruct
      - path: internal/server/render.go
        linters:
          - exhaustruct
      - path: internal/renderer/diagrams.go
        linters:
          - exhaustruct
      - path: internal/renderer/diagram_extension.go
        linters:
          - exhaustruct
      - path: internal/renderer/admonition_extension.go
        linters:
          - exhaustruct
      - path: internal/renderer/markdown_bench_test.go
        linters:
          - funlen
      - path: internal/renderer/admonition_extension_test.go
        text: Function 'TestAdmonitionExtension' is too long
        linters:
          - funlen
      - path: internal/content/search_test.go
        text: Function 'TestSearcher_Search' is too long
        linters:
          - funlen
      - path: internal/content/filesystem_test.go
        text: Function 'TestFileSystemRepository_Get' is too long
        linters:
          - funlen
      - path: internal/content/filesystem_test.go
        text: Function 'TestFileSystemRepository_GetRaw' is too long
        linters:
          - funlen
      - path: (.*)_test\.go
        linters:
          - gochecknoinits
      - path: internal/renderer/admonition_extension.go
        linters:
          - gochecknoglobals
      - path: internal/renderer/diagram_extension.go
        linters:
          - gochecknoglobals
      - path: internal/content/blob.go
        linters:
          - gocognit
      - path: (.*)_test\.go
        linters:
          - gocognit
      - path: cmd/dynamic-markdown-site/watcher.go
        linters:
          - gocognit
      - path: internal/container/container_test.go
        linters:
          - nestif
      - path: cmd/dynamic-markdown-site/watcher.go
        linters:
          - nestif
      - path: (.*)_test\.go
        linters:
          - paralleltest
      - path: internal/version/version.go
        text: avoid package names that conflict with Go standard library package names
        linters:
          - revive
      - path: internal/server/
        text: should have a package comment
        linters:
          - revive
      - path: internal/server/robots_test.go
        linters:
          - golines
      - path: internal/renderer/admonition_extension.go
        linters:
          - golines
      - path: internal/renderer/admonition_extension_test.go
        linters:
          - golines
      - path: internal/renderer/diagram_extension.go
        linters:
          - golines
      - path: internal/domain/file.go
        linters:
          - golines
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
issues:
  max-issues-per-linter: 100
  max-same-issues: 20
