version: "2"
run:
  timeout: 5m
  go: 1.26.1
  build-tags: []
  allow-parallel-runners: false
  allow-serial-runners: false
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - maintidx
    - mirror
    - testifylint
    - thelper
    - loggercheck
    - spancheck
    - govet
    - gosec
    - gochecksumtype
    - errchkjson
    - unconvert
    - gocritic
    - errname
    - usetesting
    - sloglint
    - wrapcheck
    - nilnesserr
    - nestif
    - goconst
    - predeclared
    - wastedassign
    - ginkgolinter
    - funlen
    - reassign
    - gosmopolitan
    - gochecknoglobals
    - copyloopvar
    - zerologlint
    - interfacebloat
    - cyclop
    - gocognit
    - sqlclosecheck
    - nakedret
    - staticcheck
    - contextcheck
    - dupl
    - nilerr
    - errcheck
    - errorlint
    - gochecknoinits
    - prealloc
    - protogetter
    - unused
    - recvcheck
    - misspell
    - revive
    - bodyclose
    - noctx
    - unparam
    - ineffassign
    - nilnil
    - nolintlint
    - perfsprint
    - rowserrcheck
    - exhaustruct
    - gocyclo
    - intrange
    - durationcheck
    - paralleltest
    - musttag
    - forcetypeassert
    - exhaustive
  settings:
    funlen:
      lines: 150
      statements: 80
    gosec:
      excludes:
        - G204
        - G304
        - G306
        - G301
        - G203
        - G115
        - G703
        - G702
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    warn-unused: true
    rules:
      # cyclop: config handling is inherently procedural with many conditionals
      - path: "internal/config/config.go"
        linters: [cyclop]
      - path: "internal/content/blob.go"
        linters: [cyclop]
        text: "calculated cyclomatic complexity for function buildTree is"
      - path: "internal/content/filesystem.go"
        linters: [cyclop]
        text: "calculated cyclomatic complexity for function walkEntry is 12"
      - path: "cmd/dynamic-markdown-site/main.go"
        linters: [cyclop]
        text: "calculated cyclomatic complexity for function run is 12"
      - path: "cmd/dynamic-markdown-site/watcher.go"
        linters: [cyclop]
        text: "calculated cyclomatic complexity for function watchForChanges is"
      - path: "internal/server/suggestions.go"
        linters: [cyclop]
        text: "calculated cyclomatic complexity for function findSuggestions is"
      # Test files often have complex table-driven tests
      - path: "(.*)_test\\.go"
        linters: [cyclop]
      # exhaustruct: Test structs often don't need all fields - exclude all test files
      - path: "(.*)_test\\.go"
        linters: [exhaustruct]
      # exhaustruct: Testutil package provides fixtures with minimal initialization
      - path: "internal/testutil/"
        linters: [exhaustruct]
      # exhaustruct: Production code - partial struct initialization is intentional design
      - path: "internal/content/filesystem.go"
        linters: [exhaustruct]
      - path: "internal/content/blob.go"
        linters: [exhaustruct]
      - path: "internal/content/memory.go"
        linters: [exhaustruct]
      - path: "internal/domain/file.go"
        linters: [exhaustruct]
      - path: "internal/renderer/markdown.go"
        linters: [exhaustruct]
      - path: "internal/server/ratelimit.go"
        linters: [exhaustruct]
      - path: "internal/server/render.go"
        linters: [exhaustruct]
      # exhaustruct: Third-party D2 library types have many optional fields
      - path: "internal/renderer/diagrams.go"
        linters: [exhaustruct]
      # exhaustruct: ast.BaseBlock has unexported fields, cannot fully initialize
      - path: "internal/renderer/diagram_extension.go"
        linters: [exhaustruct]
      - path: "internal/renderer/admonition_extension.go"
        linters: [exhaustruct]
      # funlen: Complex test functions with many table-driven cases
      - path: "internal/renderer/markdown_bench_test.go"
        linters: [funlen]
      - path: "internal/renderer/admonition_extension_test.go"
        linters: [funlen]
        text: "Function 'TestAdmonitionExtension' is too long"
      - path: "internal/content/search_test.go"
        linters: [funlen]
        text: "Function 'TestSearcher_Search' is too long"
      - path: "internal/content/filesystem_test.go"
        linters: [funlen]
        text: "Function 'TestFileSystemRepository_Get' is too long"
      - path: "internal/content/filesystem_test.go"
        linters: [funlen]
        text: "Function 'TestFileSystemRepository_GetRaw' is too long"
      # gochecknoinits: Test init functions for benchmark setup
      - path: "(.*)_test\\.go"
        linters: [gochecknoinits]
      # gochecknoinits: testutil uses init to set gin test mode
      - path: "internal/testutil/"
        linters: [gochecknoinits]
      # gochecknoglobals: intentional const maps and parser context keys
      - path: "internal/renderer/admonition_extension.go"
        linters: [gochecknoglobals]
      - path: "internal/renderer/diagram_extension.go"
        linters: [gochecknoglobals]
      # gocognit: buildTree has inherent complexity from path hierarchy processing
      - path: "internal/content/blob.go"
        linters: [gocognit]
      # gocognit: Complex functions that are inherently complex
      - path: "(.*)_test\\.go"
        linters: [gocognit]
      - path: "cmd/dynamic-markdown-site/watcher.go"
        linters: [gocognit]
      # nestif: Complex control flow for file watching and debouncing
      - path: "internal/container/container_test.go"
        linters: [nestif]
      - path: "cmd/dynamic-markdown-site/watcher.go"
        linters: [nestif]
      # paralleltest: Will be addressed separately - requires careful review
      - path: "(.*)_test\\.go"
        linters: [paralleltest]
      # revive: Package name 'version' conflicts with go/version stdlib - ldflags require this path
      - path: "internal/version/version.go"
        linters: [revive]
        text: "avoid package names that conflict with Go standard library package names"
      # revive: Package comments not consistently enforced across codebase
      - path: "internal/server/"
        linters: [revive]
        text: "should have a package comment"
      # golines: robots_test.go struct alignment is intentionally aligned to longest field
      - path: "internal/server/robots_test.go"
        linters: [golines]
      # golines: const blocks and long function signatures are intentionally formatted
      - path: "internal/renderer/admonition_extension.go"
        linters: [golines]
      - path: "internal/renderer/admonition_extension_test.go"
        linters: [golines]
      - path: "internal/renderer/diagram_extension.go"
        linters: [golines]
      - path: "internal/domain/file.go"
        linters: [golines]
formatters:
  enable:
    - golines
issues:
  max-issues-per-linter: 100
  max-same-issues: 20
