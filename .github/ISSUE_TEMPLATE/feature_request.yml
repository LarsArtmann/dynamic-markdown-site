name: Feature request
description: Suggest an enhancement to the server or website
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what stands in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Include alternatives you considered.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked [ROADMAP.md](https://github.com/LarsArtmann/dynamic-markdown-site/blob/master/ROADMAP.md) for existing plans
          required: true
