name: Bug report
description: Report something broken in the server, API, or website
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the server with `dynamic-markdown-site -dev -root ./content`
        2. Request ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - HTTP server / API
        - Markdown rendering
        - Search
        - Caching
        - Storage (filesystem / blob)
        - Dev mode (file watching, live reload)
        - Website (Astro/Starlight)
        - Build / CI / release
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: dynamic-markdown-site --version, or the commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
