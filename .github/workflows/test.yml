name: Test

on:
  push:
    branches: [master]
    paths:
      - "**.go"
      - "**.templ"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Dockerfile"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  TEMPL_VERSION: "v0.3.1020"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  # encoding/json/v2 (see AGENTS.md gotcha #12): every Go compile in CI needs
  # the experiment enabled, including golangci-lint's type-checked analysis.
  GOEXPERIMENT: jsonv2

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Generate templ templates
        run: templ generate

      - name: Verify templ is in sync
        run: |
          if [[ -n "$(git status --porcelain templates/*_templ.go)" ]]; then
            echo "::error::Generated templ files are out of date. Run 'templ generate' and commit."
            git status --porcelain templates/*_templ.go
            exit 1
          fi

      - name: Run tests with race + coverage
        run: go test ./... -cover -race -coverprofile=coverage.out -covermode=atomic

      - name: Enforce coverage threshold on Go packages (≥75%)
        run: |
          # Compute total statement coverage over all Go packages EXCLUDING
          # the auto-generated templ files and the test helper package.
          FAILED=0
          while IFS= read -r line; do
            # line is "ok  <pkg>  <time>  coverage:  NN.N% of statements"
            pkg=$(echo "$line" | awk '{print $2}')
            cov=$(echo "$line" | grep -oE 'coverage: [0-9.]+%' | awk '{print $2}' | tr -d '%')
            if [[ -z "$cov" ]]; then
              continue
            fi
            case "$pkg" in
              *templates|*internal/test|*internal/version|*cmd/dynamic-markdown-site|*internal/container)
                # internal/container is wired through subprocess tests (config.Load
                # owns flag.Parse), so per-package coverage metrics cannot observe
                # its execution; the lifecycle itself is covered in subprocess.
                echo "  skip $pkg ($cov%)"
                continue
                ;;
            esac
            awk -v c="$cov" -v p="$pkg" 'BEGIN { exit !(c+0 >= 75) }' && \
              echo "  OK   $pkg $cov%" || \
              { echo "  FAIL $pkg $cov% (below 75% threshold)"; FAILED=1; }
          done < <(go test ./... -cover 2>&1 | grep -E '^ok\s')
          exit "$FAILED"

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

      - name: Repetition guard for concurrent rate-limiter test
        run: go test ./internal/server/ -run TestRateLimiter_Concurrent -race -count=10

      - name: Dev build tag suite (live reload is dev-only — gotcha 22)
        run: go test -tags dev ./internal/server/ -race -count=1

      - name: Probe e2e — readyz flips to 503 and healthcheck exits 1 when the repository dies
        run: |
          set -euo pipefail

          go build -o /tmp/dms ./cmd/dynamic-markdown-site

          root="$(mktemp -d)"
          port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          /tmp/dms -port "$port" -root "$root" -timeout 5s &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          code=""
          for _ in $(seq 1 50); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$port/readyz" || true)
            [ "$code" = "200" ] && break
            sleep 0.2
          done
          [ "$code" = "200" ] || { echo "readyz = $code, want 200 for a healthy boot"; exit 1; }

          # Kill the repository underneath the running server: readiness must
          # notice (probe refresh ≤ 15s) while liveness stays green.
          chmod 000 "$root"

          code=""
          for _ in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$port/readyz" || true)
            [ "$code" = "503" ] && break
            sleep 0.2
          done
          [ "$code" = "503" ] || { echo "readyz = $code, want 503 after the repository died"; exit 1; }

          liveness=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$port/healthz")
          [ "$liveness" = "200" ] || { echo "healthz = $liveness, want 200 (liveness never checks dependencies)"; exit 1; }

          if /tmp/dms healthcheck --addr "127.0.0.1:$port" --timeout 5; then
            echo "healthcheck subcommand exited 0 for a 503 verdict"; exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Generate templ templates
        run: templ generate

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Run nix flake check
        run: nix flake check --impure
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
